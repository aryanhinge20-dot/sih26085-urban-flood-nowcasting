[project]
name = "floodnet"
version = "0.1.0"
description = "SIH26085 Urban Flood Nowcasting - Mumbai pilot"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "shapely>=2.0",
  "pyproj>=3.6",
  "networkx>=3.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pytest>=8.0",
]

[project.optional-dependencies]
swmm = ["pyswmm>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["floodnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: opt-in tests that call a real external API (e.g. IMD); skipped unless real credentials are configured",
]
